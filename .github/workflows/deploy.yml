name: Desplegar Portafolio a GitHub Pages

on:
  push:
    branches:
      - main # Se ejecuta cada vez que subes cambios a la rama main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar proyecto
        run: npm run build

      - name: Configurar entorno de Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite compila por defecto en esta carpeta

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4